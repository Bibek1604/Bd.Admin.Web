name: CI + Deploy Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Existing lint findings are reported without blocking deployment.
      # Build and tests remain required gates before the deploy job runs.
      - run: npm run lint
        continue-on-error: true
      - run: npm test --if-present
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: "/tmp/admin-side-lic-dist"
          strip_components: 1
          overwrite: true
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            sudo mkdir -p /www/wwwroot/admin-side-lic
            sudo cp -R /tmp/admin-side-lic-dist/. /www/wwwroot/admin-side-lic/
            sudo rm -rf /tmp/admin-side-lic-dist
            sudo /www/server/nginx/sbin/nginx -t
            sudo /www/server/nginx/sbin/nginx -s reload
