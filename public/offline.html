<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3a66" />
  <title>Offline · BeemaDiary Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #0f172a;
    }
    main { max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #475569; line-height: 1.55; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; border-radius: 12px; cursor: pointer;
      min-height: 48px; padding: 0 28px; font-size: 16px; font-weight: 600;
      background: #0b3a66; color: #fff;
    }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>The BeemaDiary Admin console needs an internet connection. Admin data is never stored on the device for offline use.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
